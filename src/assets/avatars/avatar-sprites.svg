      <rect x="6" y="9" width="20" height="12" rx="2" fill="var(--hood,#56427b)"/>
      <rect x="10" y="10" width="12" height="11" rx="2" fill="var(--skin,#f2b987)"/>
      <rect x="11" y="14" width="3" height="2" fill="#1e1b29"/>
