<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <g id="egg">
      <rect x="10" y="7" width="12" height="3" fill="#f9f1cf"/>
      <rect x="8" y="10" width="16" height="12" rx="4" fill="#fff4d7"/>
      <rect x="9" y="22" width="14" height="4" fill="#e8cf98"/>
      <rect x="12" y="13" width="3" height="3" fill="var(--spot,#f0a85e)"/>
      <rect x="18" y="17" width="3" height="3" fill="var(--spot,#f0a85e)"/>
    </g>
    <g id="body">
      <rect x="9" y="9" width="14" height="14" rx="5" fill="var(--body,#7adbd0)"/>
      <rect x="7" y="16" width="4" height="5" fill="var(--wing,#58bfb5)"/>
      <rect x="21" y="16" width="4" height="5" fill="var(--wing,#58bfb5)"/>
      <rect x="12" y="13" width="3" height="3" fill="#1e1b29"/>
      <rect x="18" y="13" width="3" height="3" fill="#1e1b29"/>
      <rect x="14" y="18" width="5" height="2" fill="var(--mouth,#e86b6b)"/>
      <rect x="11" y="24" width="3" height="3" fill="#f2b35f"/>
      <rect x="18" y="24" width="3" height="3" fill="#f2b35f"/>
    </g>
  </defs>

  <symbol id="stage0-idle" viewBox="0 0 32 32"><g style="--spot:#f0a85e"><use href="#egg"/></g></symbol>
  <symbol id="stage0-happy" viewBox="0 0 32 32"><g style="--spot:#ffca5f"><use href="#egg"/></g><rect x="14" y="5" width="4" height="2" fill="#ffca5f"/></symbol>
  <symbol id="stage0-sleepy" viewBox="0 0 32 32"><g style="--spot:#9aa0b8"><use href="#egg"/></g><rect x="20" y="6" width="3" height="1" fill="#9aa0b8"/></symbol>

  <symbol id="stage1-idle" viewBox="0 0 32 32"><g style="--body:#7adbd0;--wing:#58bfb5"><use href="#body"/></g></symbol>
  <symbol id="stage1-happy" viewBox="0 0 32 32"><g style="--body:#84f0de;--wing:#58d4c2;--mouth:#ff7070"><use href="#body"/></g><rect x="14" y="6" width="4" height="3" fill="#ffca5f"/></symbol>
  <symbol id="stage1-sleepy" viewBox="0 0 32 32"><g style="--body:#82b9c9;--wing:#6798a6;--mouth:#746c91"><use href="#body"/></g><rect x="23" y="8" width="3" height="1" fill="#c9c4df"/></symbol>

  <symbol id="stage2-idle" viewBox="0 0 32 32"><g style="--body:#81d672;--wing:#58a850"><use href="#body"/></g><rect x="13" y="6" width="6" height="4" fill="#4ea85d"/></symbol>
  <symbol id="stage2-happy" viewBox="0 0 32 32"><g style="--body:#9af082;--wing:#65c95b;--mouth:#ff7070"><use href="#body"/></g><rect x="12" y="5" width="8" height="5" fill="#ffca5f"/></symbol>
  <symbol id="stage2-sleepy" viewBox="0 0 32 32"><g style="--body:#85ad7c;--wing:#667f60;--mouth:#746c91"><use href="#body"/></g><rect x="23" y="8" width="3" height="1" fill="#c9c4df"/></symbol>

  <symbol id="stage3-idle" viewBox="0 0 32 32"><g style="--body:#d8a2ff;--wing:#9e70cc"><use href="#body"/></g><rect x="12" y="5" width="8" height="5" fill="#ffc247"/><rect x="5" y="12" width="4" height="3" fill="#ffc247"/><rect x="23" y="12" width="4" height="3" fill="#ffc247"/></symbol>
  <symbol id="stage3-happy" viewBox="0 0 32 32"><g style="--body:#e2b6ff;--wing:#b184e0;--mouth:#ff7070"><use href="#body"/></g><rect x="11" y="4" width="10" height="6" fill="#ffc247"/><rect x="4" y="11" width="5" height="4" fill="#ffc247"/><rect x="23" y="11" width="5" height="4" fill="#ffc247"/></symbol>
  <symbol id="stage3-sleepy" viewBox="0 0 32 32"><g style="--body:#a98dc4;--wing:#7d6599;--mouth:#746c91"><use href="#body"/></g><rect x="13" y="6" width="6" height="4" fill="#bda16a"/><rect x="23" y="8" width="3" height="1" fill="#c9c4df"/></symbol>
</svg>
